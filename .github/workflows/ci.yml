name: SecureClinic CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow can only read the code
permissions:
  contents: read

# Cancel an old run when a new commit is pushed on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Backend: Laravel (PHP 8.3) - build + tests (P3, P6)
  # ---------------------------------------------------------------
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Skip if no Laravel code yet
        if: hashFiles('backend/composer.json') == ''
        run: echo "::notice::backend/composer.json not found - backend job skipped"

      - name: Setup PHP
        if: hashFiles('backend/composer.json') != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Cache Composer packages
        if: hashFiles('backend/composer.json') != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        if: hashFiles('backend/composer.json') != ''
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        if: hashFiles('backend/composer.json') != ''
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        if: hashFiles('backend/composer.json') != ''
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  # ---------------------------------------------------------------
  # Frontend: React (Node 22) - lint + tests + build
  # ---------------------------------------------------------------
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Skip if no frontend code yet
        if: hashFiles('frontend/package.json') == ''
        run: echo "::notice::frontend/package.json not found - frontend job skipped"

      - name: Setup Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('frontend/package.json') != ''
        run: npm run lint --if-present

      - name: Tests
        if: hashFiles('frontend/package.json') != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        run: npm run build

  # ---------------------------------------------------------------
  # Mobile: React Native (Node 22) - lint + tests
  # ---------------------------------------------------------------
  mobile-check:
    name: mobile-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Skip if no mobile code yet
        if: hashFiles('mobile/package.json') == ''
        run: echo "::notice::mobile/package.json not found - mobile job skipped"

      - name: Setup Node
        if: hashFiles('mobile/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: hashFiles('mobile/package.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('mobile/package.json') != ''
        run: npm run lint --if-present

      - name: Tests
        if: hashFiles('mobile/package.json') != ''
        run: npm test --if-present