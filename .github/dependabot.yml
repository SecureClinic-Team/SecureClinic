# Dependabot: opens a PR when a newer version of a dependency is available.
# Each PR goes through the CI and the review like any other change.
version: 2
updates:
  # GitHub Actions used in .github/workflows/ (pinned by SHA)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["type:pipeline", "P4-vulnerabilites", "area:infra"]
    commit-message:
      prefix: "ci"

  # Backend: Laravel (composer.json)
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["P4-vulnerabilites", "area:backend"]
    commit-message:
      prefix: "chore"

  # Web: React (package.json) - update the path if the folder becomes web/ (#9)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["P4-vulnerabilites", "area:web"]
    commit-message:
      prefix: "chore"

  # Mobile: Expo (package.json)
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["P4-vulnerabilites", "area:mobile"]
    commit-message:
      prefix: "chore"
